<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React App with JSX</title>
</head>
<body>
  <div id="root"></div>

  <!-- React and ReactDOM (UMD builds) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (for JSX support in browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <!-- React App Code -->
  <script type="text/babel">
    function App() {
      return (
        <div>
          <h1>Hello, React with JSX!</h1>
          <p>This is rendered using Babel in the browser.</p>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    ReactDOM.render(<App />, rootElement); // ✅ Using render, not createRoot
  </script>
  <script type="text/babel" src="script.js"></script>
</body>
</html>
